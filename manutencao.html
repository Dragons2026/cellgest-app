<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CellGest - Manutenção</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f8fc;color:#132238}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer;background:#1769ff;color:#fff}.ghost{background:#eef3f8;color:#334a65}.panel{background:#fff;border:1px solid #dbe3ee;border-radius:14px;margin-top:18px;padding:20px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.wide{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #cfd9e6;border-radius:8px;background:#fff}.device{padding:14px;background:#eef3f8;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:12px;padding:16px}.card b{display:block;font-size:22px;margin-top:5px}table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}th,td{padding:12px;border-top:1px solid #e5ebf2;text-align:left}th{background:#eef3f8}@media(max-width:700px){.form,.cards{grid-template-columns:1fr}.wide{grid-column:auto}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><div><h1>🔧 Manutenção</h1><div>Controle de aparelhos em conserto pelo IMEI</div></div><button class="btn ghost" onclick="location.href='index.html'">← Voltar ao CellGest</button></div><div class="cards"><div class="card"><span>Em manutenção</span><b id="count">0</b></div><div class="card"><span>Custo total</span><b id="cost">R$ 0,00</b></div><div class="card"><span>Concluídas</span><b id="done">0</b></div></div><div class="panel"><div class="form"><label class="wide">IMEI — leitor de código de barras<div style="display:flex;gap:8px"><input id="imei" maxlength="15" inputmode="numeric" autocomplete="off" placeholder="Leia ou digite os 15 números"><button class="btn" type="button" onclick="document.getElementById('imei').focus()">▥ Ler</button></div></label><div id="device" class="device wide">Aguardando leitura do IMEI.</div><label>Tipo de manutenção<select id="service"><option>Troca de tela</option><option>Troca de bateria</option><option>Conector de carga</option><option>Câmera</option><option>Áudio / microfone</option><option>Placa</option><option>Carcaça</option><option>Face ID / biometria</option><option>Diagnóstico</option><option>Outro</option></select></label><label>Valor da manutenção<input id="value" type="number" step="0.01" placeholder="0,00"></label><label>Data de entrada<input id="date" type="date"></label><label>Previsão de entrega<input id="due" type="date"></label><label>Técnico / assistência<input id="tech"></label><label>Status<select id="status"><option>Em manutenção</option><option>Aguardando peça</option><option>Pronto</option><option>Entregue</option></select></label><label class="wide">Observações<textarea id="notes" rows="3"></textarea></label><div class="wide"><button class="btn" onclick="save()">Salvar manutenção</button></div></div></div><div class="panel"><h3>Histórico de manutenção</h3><table><thead><tr><th>IMEI / aparelho</th><th>Serviço</th><th>Entrada</th><th>Previsão</th><th>Status</th><th>Valor</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const getDevices=()=>JSON.parse(localStorage.getItem('cellgest_devices')||'[]');const getMaint=()=>JSON.parse(localStorage.getItem('cellgest_maintenance')||'[]');let current=null;function find(){let v=imei.value.replace(/\D/g,'').slice(0,15);imei.value=v;current=null;if(v.length!==15){device.textContent='Aguardando IMEI completo (15 números).';return}let d=getDevices().find(x=>x.imei===v);if(!d){device.textContent='IMEI não encontrado no estoque. Cadastre o aparelho primeiro no CellGest.';return}current=d;device.innerHTML='<b>'+d.model+'</b><br>Empresa: '+d.company+' · Status atual: '+d.status}imei.addEventListener('input',find);function save(){find();if(!current){alert('Leia um IMEI cadastrado no CellGest.');return}if(!date.value){alert('Informe a data de entrada.');return}let a=getMaint();a.push({id:Date.now(),imei:current.imei,model:current.model,company:current.company,service:service.value,value:parseFloat(value.value)||0,date:date.value,due:due.value,tech:tech.value.trim(),status:status.value,notes:notes.value.trim()});localStorage.setItem('cellgest_maintenance',JSON.stringify(a));let dev=getDevices();let i=dev.findIndex(x=>x.imei===current.imei);if(i>=0){dev[i].status=status.value==='Entregue'?'Em estoque':'Em conserto';dev[i].condition='Manutenção';localStorage.setItem('cellgest_devices',JSON.stringify(dev))}imei.value='';value.value='';tech.value='';notes.value='';device.textContent='Aguardando leitura do IMEI.';current=null;render();alert('Manutenção salva e vinculada ao aparelho.')}function finish(id){let a=getMaint(),i=a.findIndex(x=>x.id===id);if(i<0)return;a[i].status='Entregue';localStorage.setItem('cellgest_maintenance',JSON.stringify(a));let dev=getDevices(),j=dev.findIndex(x=>x.imei===a[i].imei);if(j>=0){dev[j].status='Em estoque';localStorage.setItem('cellgest_devices',JSON.stringify(dev))}render()}function render(){let a=getMaint();count.textContent=a.filter(x=>x.status!=='Entregue').length;done.textContent=a.filter(x=>x.status==='Entregue').length;cost.textContent=brl(a.reduce((s,x)=>s+x.value,0));rows.innerHTML=a.slice().reverse().map(x=>'<tr><td><b>'+x.model+'</b><br>'+x.imei+'</td><td>'+x.service+'</td><td>'+x.date.split('-').reverse().join('/')+'</td><td>'+(x.due?x.due.split('-').reverse().join('/'):'—')+'</td><td>'+x.status+'</td><td>'+brl(x.value)+'</td><td>'+(x.status!=='Entregue'?'<button class="btn" onclick="finish('+x.id+')">Concluir</button>':'✓')+'</td></tr>').join('')||'<tr><td colspan="7">Nenhuma manutenção cadastrada.</td></tr>'}render();setTimeout(()=>imei.focus(),100)</script></body></html>
